# Builds the Windows binary and publishes a GitHub release whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# A tag with a suffix (v0.2.0-rc.1) is published as a pre-release.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # creating the release and uploading the binary

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # The binary name from Cargo.toml (see src/brand.rs); a rename touches this too.
      BIN: floodlight
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The tag must match the version in Cargo.toml, so `--version` and the release agree.
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$BIN-$GITHUB_REF_NAME-windows-x86_64.exe"
          cp "target/release/$BIN.exe" "$asset"
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "$asset" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
