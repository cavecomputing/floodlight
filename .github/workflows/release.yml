# Builds the Windows and Linux binaries and publishes a GitHub release for a version tag. tag.yml
# calls it after tagging a new Cargo.toml version pushed to main (a tag pushed by a workflow starts
# no other workflow, so it can't rely on the push below); pushing a tag by hand still works:
#   git tag v0.1.0 && git push origin v0.1.0
# A tag with a suffix (v0.2.0-rc.1) is published as a pre-release.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write # creating the release and uploading the binaries

env:
  # The binary name from Cargo.toml (see src/brand.rs); a rename touches this too.
  BIN: floodlight
  # The tag being released: tag.yml's when it calls, else the one pushed.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked
          cp "target/release/$BIN.exe" "$BIN-$TAG-windows-x86_64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.BIN }}-${{ env.TAG }}-windows-x86_64.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # musl instead of glibc: the binary is linked statically, so it runs on any distro whatever
      # its glibc. musl-gcc compiles ring's C (the TLS crypto under ureq).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        run: cargo test --locked

      - name: Build
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          tar -czf "$BIN-$TAG-linux-x86_64.tar.gz" \
            -C target/x86_64-unknown-linux-musl/release "$BIN"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ env.BIN }}-${{ env.TAG }}-linux-x86_64.tar.gz

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # The tag must match the version in Cargo.toml, so `--version` and the release agree.
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi

      # Both jobs' files, side by side in the working folder.
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" "$BIN-$TAG"-* \
            --title "$TAG" --generate-notes $prerelease
