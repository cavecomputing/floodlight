[package]
name = "floodlight"
version = "0.5.0"
edition = "2024"
license = "MIT"

[dependencies]
# One error type for main and the outputs, with a line of context on what failed.
anyhow = "1"
# The date and time on a report, in this machine's time zone.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# The command line: the flags, their rules (which go together) and the help.
clap = { version = "4", features = ["derive"] }
# The data folder on each OS, where the macOS WiFi helper app is written.
directories = "6"
# Reverse DNS (the OS's getnameinfo) for the name column.
dns-lookup = "4"
# DNS messages for the dns mode: building the question and reading every record type in the answer.
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
# This machine's addresses and netmasks, for the default subnet.
if-addrs = "0.15"
# Reads 192.168.1.0/24 and walks its addresses.
ipnet = "2"
# The screens: drawing the table and the status bar, reading key presses.
ratatui = "0.30"
# Reading ping's round trip and the ARP table's lines.
regex = "1"
# Runs the sweep: 128 pings at once, each a child process, and the name lookups beside them.
tokio = { version = "1", features = ["rt-multi-thread", "process", "net", "sync", "time", "macros"] }
# The speed test's HTTPS to Cloudflare, with its own TLS (rustls), so it needs nothing installed.
# No gzip: a compressed download would measure the wrong number of bytes. Cookies: hand back
# what Cloudflare sets, as a browser and other speed test clients do; uploads were refused without.
ureq = { version = "3", default-features = false, features = ["rustls", "cookies"] }

# The ICMP datagram socket `ping` sends through, which needs no root and std can't open (Linux
# and macOS), and the receive buffer `lanspeed` widens on its UDP sockets, which std can't set
# either: the OS's default drops datagrams at a few hundred Mbps. Already built for tokio, so it
# costs nothing.
socket2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux's error queue, where `trace` hears the router a hop's echo ran out at, which neither std
# nor socket2 can read. Already built for tokio and socket2, so it costs nothing.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows' own wifi service (wlanapi): ask it to scan and read what it heard, which netsh can't.
# Its ping call and route table (iphlpapi) for --ping: no Administrator needed, unlike a socket.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
] }

[profile.release]
strip = true

# Dependencies are optimised even in a debug build (`cargo run`): unoptimised, rustls can't
# decrypt a download at a gigabit, and the speed test would measure the build, not the line.
[profile.dev.package."*"]
opt-level = 3
